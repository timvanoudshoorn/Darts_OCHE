name: OCHE
options:
  bundleIdPrefix: com.oche
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    # Bump these on every meaningful change so AltStore/iOS treats a fresh
    # IPA as an update instead of skipping the (re)install.
    MARKETING_VERSION: "2.1"
    CURRENT_PROJECT_VERSION: "5"

targets:
  OCHE:
    type: application
    platform: iOS
    sources:
      - path: OCHE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oche.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  OCHETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OCHETests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oche.tests
    dependencies:
      - target: OCHE

schemes:
  OCHE:
    build:
      targets:
        OCHE: all
        OCHETests: [test]
    test:
      targets:
        - OCHETests
    run:
      config: Debug
